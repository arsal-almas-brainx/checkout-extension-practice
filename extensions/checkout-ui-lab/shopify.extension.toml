# ─────────────────────────────────────────────────────────────────────────────
# Checkout UI extension — the manifest.
# The CLI adds a `uid = "..."` line automatically on first build. Leave it.
# ─────────────────────────────────────────────────────────────────────────────
api_version = "2026-07"

[[extensions]]
uid = "e44f542e-be92-5b07-09a8-a1be34b048172937de8c"
type   = "ui_extension"
name   = "Checkout UI Lab"
handle = "checkout-ui-lab"

  # Capabilities are opt-in. Turn on only what you use — each one is a
  # permission the merchant sees when they install the app.
  [extensions.capabilities]
  api_access     = false  # only needed for the Storefront API (see upsell-offer)
  block_progress = true   # allowed to stop the buyer advancing (Lesson 3)
  network_access = false  # set true only if you fetch() an external API

  # ── Lesson 1 + 2 + 3: a merchant-placeable block ──────────────────────────
  # `purchase.checkout.block.render` is a DYNAMIC target: it does not appear
  # anywhere until the merchant drags it into place in the checkout editor.
  #
  # ⚠️ block_progress above is only a REQUEST. The merchant must also turn on
  # "Allow app to block checkout" in the block's editor panel, or the
  # TermsGate in Lesson 3 shows its error but checkout still lets buyers pass.
  [[extensions.targeting]]
  target = "purchase.checkout.block.render"
  module = "./src/Checkout.tsx"

  # Lessons 4, 8 and 9 (static targets) live in their OWN extensions:
  # extensions/delivery-notes and extensions/upsell-offer. See the comment at
  # the top of delivery-notes/shopify.extension.toml for why.

  # ── Lesson 5: post-purchase (Thank you page) ──────────────────────────────
  [[extensions.targeting]]
  target = "purchase.thank-you.block.render"
  module = "./src/ThankYou.tsx"

  # ── Merchant-configurable settings ────────────────────────────────────────
  # These render as form fields in the checkout editor. Read them at runtime
  # via `shopify.settings.value.<key>`. This is how you make ONE extension
  # reusable instead of hardcoding values.
  [extensions.settings]

    [[extensions.settings.fields]]
    key  = "free_shipping_threshold"
    type = "number_integer"
    name = "Free shipping threshold"
    description = "Cart total needed for free shipping, in your store currency."

    [[extensions.settings.fields]]
    key  = "gift_note_label"
    type = "single_line_text_field"
    name = "Gift note label"
    description = "Label shown above the gift note field."

# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ad1c20a33a83e9302763c5e0cf74d169"
name = "Checkout Extension Practice"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Functions are inert until activated by a mutation, and each mutation needs
# its own scope:
#   write_validations                 validationCreate (Lesson 6, ZIP blocker)
#   write_delivery_customizations     deliveryCustomizationCreate (Lesson 7)
#   write_discounts                   discountAutomaticAppCreate / discountCodeAppCreate (10-11)
#   write_payment_customizations      paymentCustomizationCreate (Lesson 12)
#   write_cart_transforms             cartTransformCreate (Lesson 15)
#   write_fulfillment_constraint_rules fulfillmentConstraintRuleCreate (Lesson 16)
#   write_products                    the bundle-components metafield on the kit (15)
#   write_locations, write_inventory  store setup for Lesson 16 (second warehouse + stock)
#   write_markets, write_shipping     store setup for the ZIP blocker (Pakistan market + rate)
#   write_publications                publish the training products to the Online Store
# Adding a scope makes the merchant re-approve the app.
scopes = "write_validations,write_delivery_customizations,write_discounts,write_payment_customizations,write_cart_transforms,write_fulfillment_constraint_rules,write_products,write_locations,write_inventory,write_markets,write_shipping,write_publications"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

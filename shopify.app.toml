# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ad1c20a33a83e9302763c5e0cf74d169"
name = "Checkout Extension Practice"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Functions are inert until activated by a mutation, and each mutation needs
# its own scope: validationCreate (Lesson 6) and deliveryCustomizationCreate
# (Lesson 7). Adding a scope makes the merchant re-approve the app.
scopes = "write_validations,write_delivery_customizations"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
